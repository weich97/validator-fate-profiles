name: Verify research artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Compile Python sources
        run: python -m compileall -q verify.py scripts
      - name: Run release-contract tests
        run: python -m unittest discover -s tests -v
      - name: Check release hygiene
        run: python scripts/check_release_hygiene.py
      - name: Verify evidence and claims
        run: python verify.py

  figure:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements/figure.txt
      - name: Install pinned renderer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/figure.txt
      - name: Rebuild and compare generated figures
        run: python verify.py --render-figure
