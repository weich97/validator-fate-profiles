name: Reproducibility report
description: Report a claim, manifest, figure, or environment discrepancy.
title: "[reproduction] "
labels: [reproducibility]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, proprietary data, or private machine paths.
  - type: input
    id: release
    attributes:
      label: Release or commit
      placeholder: v1.0.1 or a full commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
