[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "validator-fate-profiles"
version = "1.0.1"
description = "Evidence and verification tools for ordered-validator fate profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Weicheng Xue"}]
keywords = ["software testing", "fault injection", "mutation testing", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["verify.py", "scripts"]
